<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local LLM Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --user: #e8f0fe; --think: #f3f4f6;
    --code: #f6f8fa; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #1f2125; --text: #e6e6e6; --muted: #9ca3af;
      --border: #33363c; --accent: #60a5fa; --user: #23324a; --think: #26282d;
      --code: #2a2d33; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif;
    display: flex;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--danger); }

  /* sidebar */
  #sidebar {
    width: 260px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #sidebar header { padding: 12px; display: flex; gap: 8px; }
  #sidebar header button { flex: 1; }
  #convList { flex: 1; overflow-y: auto; padding: 0 8px; }
  .conv {
    padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 6px;
    align-items: center; white-space: nowrap;
  }
  .conv span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .conv:hover { background: var(--bg); }
  .conv.active { background: var(--user); }
  .conv .del { visibility: hidden; border: 0; background: none; padding: 0 4px; color: var(--muted); }
  .conv:hover .del { visibility: visible; }
  #settings { border-top: 1px solid var(--border); padding: 12px; font-size: 13px; }
  #settings summary { cursor: pointer; font-weight: 600; }
  #settings label { display: block; margin-top: 8px; color: var(--muted); }
  #settings input[type=text], #settings input[type=number], #settings textarea {
    width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); margin-top: 2px;
  }
  #settings textarea { resize: vertical; min-height: 50px; }
  #status { margin-top: 8px; font-size: 12px; color: var(--muted); word-break: break-all; }

  /* main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .msg { max-width: 820px; margin: 0 auto 18px; }
  .msg .role { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg.user .bubble {
    background: var(--user); border-radius: 12px; padding: 10px 14px; white-space: pre-wrap;
    display: inline-block; max-width: 100%;
  }
  .msg.user { text-align: right; }
  .msg.user .bubble { text-align: left; }
  .msg.assistant .bubble { padding: 0 2px; overflow-wrap: anywhere; }
  .bubble pre {
    background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto;
  }
  .bubble code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 0.92em; }
  .bubble pre code { background: none; padding: 0; }
  .bubble table { border-collapse: collapse; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 4px 8px; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  details.think {
    background: var(--think); border-radius: 8px; padding: 6px 12px; margin-bottom: 10px;
    font-size: 13px; color: var(--muted);
  }
  details.think summary { cursor: pointer; }
  details.think .think-body { white-space: pre-wrap; margin-top: 6px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .error { color: var(--danger); }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #composer {
    border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px;
  }
  #composer .inner { max-width: 820px; margin: 0 auto; }
  #input {
    width: 100%; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; background: var(--bg); min-height: 48px; max-height: 240px;
  }
  #composer .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 13px; }
  #composer .row .spacer { flex: 1; }
  #composer label { color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #toggleSidebar { display: none; }

  @media (max-width: 760px) {
    #sidebar { position: fixed; z-index: 10; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .2s; }
    body.show-sidebar #sidebar { transform: none; }
    #toggleSidebar { display: inline-block; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <header>
    <button id="newChat" class="primary">＋ 新對話</button>
  </header>
  <div id="convList"></div>
  <details id="settings">
    <summary>設定</summary>
    <label>API Base URL
      <input type="text" id="baseUrl" placeholder="http://100.103.191.79:8080/v1">
    </label>
    <label>模型
      <input type="text" id="model" list="modelList">
      <datalist id="modelList"></datalist>
    </label>
    <label>API Key（mlx_lm.server 不檢查，可留空）
      <input type="text" id="apiKey" placeholder="none">
    </label>
    <label>最大 tokens
      <input type="number" id="maxTokens" min="1" step="1">
    </label>
    <label>Temperature
      <input type="number" id="temperature" min="0" max="2" step="0.1">
    </label>
    <label>System prompt
      <textarea id="systemPrompt" placeholder="（可留空）"></textarea>
    </label>
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button id="testConn">測試連線</button>
      <button id="resetSettings">還原預設</button>
    </div>
    <div id="status"></div>
  </details>
</aside>

<main>
  <div id="messages"></div>
  <div id="composer">
    <div class="inner">
      <textarea id="input" rows="2" placeholder="輸入訊息，Enter 送出，Shift+Enter 換行"></textarea>
      <div class="row">
        <button id="toggleSidebar">☰</button>
        <label title="在訊息結尾加上 /no_think，跳過 Qwen3 的思考過程，回得比較快">
          <input type="checkbox" id="noThink"> 不思考（/no_think）
        </label>
        <label title="思考內容預設展開">
          <input type="checkbox" id="expandThink"> 展開思考
        </label>
        <span class="spacer"></span>
        <button id="stopBtn" class="danger" hidden>■ 停止</button>
        <button id="sendBtn" class="primary">送出</button>
      </div>
    </div>
  </div>
</main>

<script>
"use strict";

// When the page is served by serve.py with the proxy on, it calls same-origin /v1.
const SERVED_WITH_PROXY = location.protocol.startsWith("http") && location.search.includes("proxy=1");

const DEFAULTS = {
  baseUrl: SERVED_WITH_PROXY ? location.origin + "/v1" : "http://100.103.191.79:8080/v1",
  model: "mlx-community/Josiefied-Qwen3-14B-abliterated-v3-4bit",
  apiKey: "none",
  maxTokens: 4096,
  temperature: 0.7,
  systemPrompt: "",
  noThink: false,
  expandThink: false,
};

const $ = (id) => document.getElementById(id);
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ }
  },
};

let settings = { ...DEFAULTS, ...store.get("llmchat.settings", {}) };
// The proxy URL is never saved, but older versions did; without --proxy it would 404.
if (SERVED_WITH_PROXY || settings.baseUrl === location.origin + "/v1") settings.baseUrl = DEFAULTS.baseUrl;
let conversations = store.get("llmchat.conversations", []);
let currentId = store.get("llmchat.current", null);
let abortCtrl = null;

// ---------- settings ----------
const SETTING_FIELDS = ["baseUrl", "model", "apiKey", "maxTokens", "temperature", "systemPrompt"];
function loadSettingsUI() {
  for (const f of SETTING_FIELDS) $(f).value = settings[f];
  $("noThink").checked = settings.noThink;
  $("expandThink").checked = settings.expandThink;
}
function saveSettingsFromUI() {
  for (const f of SETTING_FIELDS) settings[f] = $(f).value.trim();
  settings.maxTokens = parseInt(settings.maxTokens, 10) || DEFAULTS.maxTokens;
  settings.temperature = settings.temperature === "" ? DEFAULTS.temperature : parseFloat(settings.temperature);
  settings.noThink = $("noThink").checked;
  settings.expandThink = $("expandThink").checked;
  // In proxy mode baseUrl is forced to this origin; keep the saved one so non-proxy pages are unaffected.
  const saved = SERVED_WITH_PROXY ? { ...settings, baseUrl: store.get("llmchat.settings", {}).baseUrl } : settings;
  store.set("llmchat.settings", saved);
}
for (const f of [...SETTING_FIELDS, "noThink", "expandThink"]) $(f).addEventListener("change", saveSettingsFromUI);
$("resetSettings").onclick = () => { settings = { ...DEFAULTS }; loadSettingsUI(); saveSettingsFromUI(); };

function apiUrl(path) {
  // Accept both "http://host:8080" and "http://host:8080/v1".
  let base = settings.baseUrl.replace(/\/+$/, "");
  if (!/\/v1$/.test(base)) base += "/v1";
  return base + path;
}
function headers() {
  const h = { "Content-Type": "application/json" };
  if (settings.apiKey) h["Authorization"] = "Bearer " + settings.apiKey;
  return h;
}
function setStatus(text, isError) {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "";
}

async function testConnection() {
  saveSettingsFromUI();
  setStatus("連線中…");
  try {
    const r = await fetch(apiUrl("/models"), { headers: headers() });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const ids = (data.data || []).map((m) => m.id);
    $("modelList").innerHTML = "";
    for (const id of ids) {
      const o = document.createElement("option"); o.value = id; $("modelList").appendChild(o);
    }
    setStatus("✓ 連線成功。可用模型：" + (ids.join(", ") || "（無）"));
  } catch (e) {
    setStatus("✗ 連不上：" + e.message + "。請確認這台電腦已登入 Tailscale，且 Base URL 正確。", true);
  }
}
$("testConn").onclick = testConnection;

// ---------- conversations ----------
function saveConversations() {
  store.set("llmchat.conversations", conversations);
  store.set("llmchat.current", currentId);
}
function current() { return conversations.find((c) => c.id === currentId); }
function newConversation() {
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "新對話", messages: [] };
  conversations.unshift(c);
  currentId = c.id;
  saveConversations();
  render();
  $("input").focus();
}
$("newChat").onclick = () => { if (!abortCtrl) newConversation(); };

function renderConvList() {
  const list = $("convList");
  list.innerHTML = "";
  for (const c of conversations) {
    const div = document.createElement("div");
    div.className = "conv" + (c.id === currentId ? " active" : "");
    const span = document.createElement("span");
    span.textContent = c.title;
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = "刪除";
    del.onclick = (ev) => {
      ev.stopPropagation();
      if (abortCtrl || !confirm("刪除這個對話？")) return;
      conversations = conversations.filter((x) => x.id !== c.id);
      if (currentId === c.id) currentId = conversations[0]?.id ?? null;
      saveConversations(); render();
    };
    div.onclick = () => {
      if (abortCtrl) return;
      currentId = c.id; saveConversations(); render();
      document.body.classList.remove("show-sidebar");
    };
    div.append(span, del);
    list.appendChild(div);
  }
}

// ---------- rendering ----------
function renderMarkdown(text) {
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }));
  }
  // CDN unavailable: show plain text.
  const pre = document.createElement("div");
  pre.style.whiteSpace = "pre-wrap";
  pre.textContent = text;
  return pre.outerHTML;
}

// Split model output into thinking and answer. Handles both a separate
// `reasoning` field and <think>...</think> embedded in content (older servers).
function splitThink(msg) {
  let think = msg.reasoning || "";
  let content = msg.content || "";
  const open = content.indexOf("<think>");
  if (open !== -1) {
    const close = content.indexOf("</think>", open);
    if (close === -1) {
      think += content.slice(open + 7);
      content = content.slice(0, open);
    } else {
      think += content.slice(open + 7, close);
      content = content.slice(0, open) + content.slice(close + 8);
    }
  } else if (content.includes("</think>")) {
    // Chat template already opened <think> in the prompt, so only the close tag streams back.
    const close = content.indexOf("</think>");
    think += content.slice(0, close);
    content = content.slice(close + 8);
  }
  return { think: think.trim(), content: content.replace(/^\s+/, "") };
}

function messageEl(msg, streaming) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + msg.role;
  const role = document.createElement("div");
  role.className = "role";
  role.textContent = msg.role === "user" ? "你" : "助理";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  wrap.append(role, bubble);
  fillMessage(wrap, msg, streaming);
  return wrap;
}

function fillMessage(wrap, msg, streaming) {
  const bubble = wrap.querySelector(".bubble");
  if (msg.role === "user") {
    bubble.textContent = msg.content;
    return;
  }
  const { think, content } = splitThink(msg);
  const userOpen = wrap.dataset.thinkOpen;
  bubble.innerHTML = "";
  if (think) {
    const d = document.createElement("details");
    d.className = "think";
    const thinking = streaming && !content;
    d.open = userOpen ? userOpen === "1" : (settings.expandThink || thinking);
    const s = document.createElement("summary");
    // Remember a manual open/close so streaming repaints don't undo it.
    s.onclick = () => { wrap.dataset.thinkOpen = d.open ? "0" : "1"; };
    s.textContent = thinking ? "思考中…" : "思考過程";
    const b = document.createElement("div");
    b.className = "think-body";
    b.textContent = think;
    d.append(s, b);
    bubble.appendChild(d);
  }
  const body = document.createElement("div");
  body.innerHTML = renderMarkdown(content);
  if (streaming) body.classList.add("cursor");
  bubble.appendChild(body);
  if (msg.error) {
    const e = document.createElement("div");
    e.className = "error"; e.textContent = msg.error;
    bubble.appendChild(e);
  }
  if (msg.meta) {
    const m = document.createElement("div");
    m.className = "meta"; m.textContent = msg.meta;
    bubble.appendChild(m);
  }
}

function renderMessages() {
  const box = $("messages");
  box.innerHTML = "";
  const c = current();
  if (!c || c.messages.length === 0) {
    box.innerHTML = '<div class="msg" style="color:var(--muted);text-align:center;margin-top:20vh">' +
      "開始聊天吧。第一次請求（server 剛重啟時）可能要多等 30 秒載入模型。</div>";
    return;
  }
  for (const m of c.messages) box.appendChild(messageEl(m, false));
  box.scrollTop = box.scrollHeight;
}

function render() { renderConvList(); renderMessages(); }

// ---------- chat ----------
function nearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }

function buildRequestMessages(c) {
  const out = [];
  if (settings.systemPrompt) out.push({ role: "system", content: settings.systemPrompt });
  for (const m of c.messages) {
    if (m.role === "user") out.push({ role: "user", content: m.sent ?? m.content });
    // Qwen3 guidance: don't feed earlier thinking back into the history.
    else if (m.role === "assistant" && !m.error) out.push({ role: "assistant", content: splitThink(m).content });
  }
  return out;
}

async function send() {
  const text = $("input").value.trim();
  if (!text || abortCtrl) return;
  saveSettingsFromUI();
  if (!current()) newConversation();
  const c = current();
  const userMsg = { role: "user", content: text, sent: settings.noThink ? text + " /no_think" : text };
  c.messages.push(userMsg);
  if (c.messages.length === 1) c.title = text.slice(0, 30);
  $("input").value = ""; autoGrow();
  renderConvList();
  if (c.messages.length === 1) $("messages").innerHTML = "";
  $("messages").appendChild(messageEl(userMsg, false));

  const reply = { role: "assistant", content: "", reasoning: "" };
  const replyEl = messageEl(reply, true);
  replyEl.querySelector(".bubble div").textContent = "等待回應…";
  $("messages").appendChild(replyEl);
  $("messages").scrollTop = $("messages").scrollHeight;

  abortCtrl = new AbortController();
  $("sendBtn").hidden = true; $("stopBtn").hidden = false;
  const started = performance.now();
  let firstTokenAt = null, completionTokens = null, chunks = 0, rafId = 0;

  try {
    const r = await fetch(apiUrl("/chat/completions"), {
      method: "POST",
      headers: headers(),
      signal: abortCtrl.signal,
      body: JSON.stringify({
        model: settings.model,
        messages: buildRequestMessages({ messages: c.messages }),
        max_tokens: settings.maxTokens,
        temperature: settings.temperature,
        stream: true,
        stream_options: { include_usage: true },
      }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 300));

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", pending = false;
    const repaint = () => {
      pending = false;
      const stick = nearBottom($("messages"));
      fillMessage(replyEl, reply, true);
      if (stick) $("messages").scrollTop = $("messages").scrollHeight;
    };
    outer: while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) !== -1) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") break outer;
        let j;
        try { j = JSON.parse(data); } catch { continue; }
        if (j.usage?.completion_tokens) completionTokens = j.usage.completion_tokens;
        const delta = j.choices?.[0]?.delta;
        if (!delta) continue;
        const piece = (delta.content || "") + (delta.reasoning || delta.reasoning_content || "");
        if (piece && firstTokenAt === null) firstTokenAt = performance.now();
        if (delta.content) reply.content += delta.content;
        if (delta.reasoning) reply.reasoning += delta.reasoning;
        if (delta.reasoning_content) reply.reasoning += delta.reasoning_content;
        if (piece) chunks++;
        if (!pending) { pending = true; rafId = requestAnimationFrame(repaint); }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") reply.error = "（已停止）";
    else if (e instanceof TypeError) {
      reply.error = "連線失敗：" + e.message + "。請確認這台電腦已登入 Tailscale、Mac 上的 server 有在跑，" +
        "以及設定中的 Base URL 正確。若是瀏覽器擋跨網域請求，請改用 serve.py 的 proxy 模式（見 README）。";
    } else reply.error = "錯誤：" + e.message;
  } finally {
    cancelAnimationFrame(rafId); // a pending streaming repaint would overwrite the final render below
    const end = performance.now();
    const tokens = completionTokens ?? chunks;
    const genSecs = firstTokenAt ? (end - firstTokenAt) / 1000 : 0;
    if (firstTokenAt) {
      reply.meta = `${tokens} tokens · ${(tokens / Math.max(genSecs, 0.001)).toFixed(1)} tok/s · ` +
        `首字 ${((firstTokenAt - started) / 1000).toFixed(1)} 秒`;
    }
    if (!reply.content && !reply.reasoning && !reply.error) reply.error = "（沒有收到內容）";
    c.messages.push(reply);
    saveConversations();
    fillMessage(replyEl, reply, false);
    abortCtrl = null;
    $("sendBtn").hidden = false; $("stopBtn").hidden = true;
    $("input").focus();
  }
}

$("sendBtn").onclick = send;
$("stopBtn").onclick = () => abortCtrl?.abort();
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
function autoGrow() {
  const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 240) + "px";
}
$("input").addEventListener("input", autoGrow);
$("toggleSidebar").onclick = () => document.body.classList.toggle("show-sidebar");

// ---------- init ----------
loadSettingsUI();
if (!current()) currentId = conversations[0]?.id ?? null;
render();
testConnection();
</script>
</body>
</html>
